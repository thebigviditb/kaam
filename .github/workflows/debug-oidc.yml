name: Debug OIDC
on: { workflow_dispatch: }
permissions: { id-token: write, contents: read }
jobs:
  claims:
    runs-on: ubuntu-latest
    environment: staging
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            const t = await core.getIDToken('sts.amazonaws.com');
            const p = JSON.parse(Buffer.from(t.split('.')[1], 'base64').toString());
            core.info(JSON.stringify({sub: p.sub, aud: p.aud, iss: p.iss, repository: p.repository, environment: p.environment}));
