name: Deploy infra

on:
  push:
    branches: [main, staging]
    paths: ['infra/**', '.github/workflows/deploy-infra.yml']
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

concurrency: infra-${{ github.ref_name }}

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: ${{ github.ref_name == 'main' && 'production' || 'staging' }}
    defaults: { run: { working-directory: infra } }
    env:
      STACK: ${{ github.ref_name == 'main' && 'kaam-prod' || 'kaam-staging' }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: us-west-2
      - run: uv sync --frozen
      - run: npm ci && (cd lambda/custom-sms-sender && npm ci)
      - run: npx -y aws-cdk@latest deploy "$STACK" --require-approval never
